#
# Builds this fork on GitHub Actions. Upstream's workflow only publishes from
# the upstream repository, so this one produces downloadable artifacts for the
# branches we actually ship from.

name: Fork build

on:
  workflow_dispatch:
    inputs:
      qt-version:
        description: "Qt version to build against (Windows and macOS arm64)"
        required: false
        default: "6.12"
  push:
    branches:
      - master
      - mac-safe
      - "perf/**"

env:
  GIT_SHA: ${{ github.sha }}

jobs:
  windows-x64:
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup VC++ environment
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: amd64

      - name: Install dependencies
        id: get-deps
        uses: ./.github/actions/install-dependencies
        with:
          qt-version: ${{ inputs.qt-version || '6.12' }}
          vcpkg-triplet: x64-windows-release

      - name: Configure
        run: >
          cmake -Bbuild -G Ninja -DCMAKE_BUILD_TYPE=Release -DSKIP_BUILD_TESTS=ON
          ${{ steps.get-deps.outputs.vcpkg-cmake-config }}

      - name: Build
        run: cmake --build build --config Release -j8 --target package

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: deskflow-windows-x64
          path: build/deskflow[-_]*.*

  macos-arm64:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dependencies
        id: get-deps
        uses: ./.github/actions/install-dependencies
        with:
          qt-version: ${{ inputs.qt-version || '6.12' }}

      - name: Configure
        run: >
          cmake -Bbuild -DCMAKE_BUILD_TYPE=Release -DSKIP_BUILD_TESTS=ON
          -DCMAKE_OSX_ARCHITECTURES="arm64" -DCMAKE_OSX_DEPLOYMENT_TARGET=14

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          cmake --build build --config Release -j8
          package_ok=false
          for i in 1 2 3 4 5; do
            if cmake --build build --config Release -j8 --target package; then
              package_ok=true
              break
            fi
            hdiutil detach /Volumes/Deskflow -force || true
            sleep 2
          done
          if [ "$package_ok" != true ]; then
            echo "dmg packaging failed" >&2
            exit 1
          fi

      - name: Verify the packaged bundle
        shell: bash
        run: |
          set -o pipefail
          dmg=$(ls build/deskflow[-_]*.dmg | head -1)
          mountpoint=$(hdiutil attach "$dmg" -nobrowse -readonly | tail -1 | awk '{print $3}')
          codesign --verify --deep --strict --verbose=2 "$mountpoint/Deskflow.app"
          "$mountpoint/Deskflow.app/Contents/MacOS/Deskflow" --version || true
          hdiutil detach "$mountpoint" -force

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: deskflow-macos-arm64
          path: |
            build/deskflow[-_]*.dmg

  macos-x64:
    runs-on: macos-15-intel
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dependencies
        id: get-deps
        uses: ./.github/actions/install-dependencies
        with:
          qt-version: "6.9.3"

      - name: Configure
        run: >
          cmake -Bbuild -DCMAKE_BUILD_TYPE=Release -DSKIP_BUILD_TESTS=ON
          -DCMAKE_OSX_ARCHITECTURES="x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=12

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          cmake --build build --config Release -j8
          package_ok=false
          for i in 1 2 3 4 5; do
            if cmake --build build --config Release -j8 --target package; then
              package_ok=true
              break
            fi
            hdiutil detach /Volumes/Deskflow -force || true
            sleep 2
          done
          if [ "$package_ok" != true ]; then
            echo "dmg packaging failed, archiving the app bundle instead" >&2
            ditto -c -k --sequesterRsrc --keepParent build/deskflow-*.app deskflow-app.zip
          fi

      - name: Verify the packaged bundle
        shell: bash
        run: |
          set -o pipefail
          dmg=$(ls build/deskflow[-_]*.dmg | head -1)
          mountpoint=$(hdiutil attach "$dmg" -nobrowse -readonly | tail -1 | awk '{print $3}')
          codesign --verify --deep --strict --verbose=2 "$mountpoint/Deskflow.app"
          hdiutil detach "$mountpoint" -force

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: deskflow-macos-x64
          path: |
            build/deskflow[-_]*.dmg
            deskflow-app.zip
